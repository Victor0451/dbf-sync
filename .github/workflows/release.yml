name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build Linux (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }} \
                      -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                      -X main.commit=${{ github.sha }}" \
            -o dbf-sync-linux-amd64

      - name: Build Linux (arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }} \
                      -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                      -X main.commit=${{ github.sha }}" \
            -o dbf-sync-linux-arm64

      - name: Build Windows (amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }} \
                      -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                      -X main.commit=${{ github.sha }}" \
            -o dbf-sync-windows-amd64.exe

      - name: Create checksums
        run: |
          sha256sum dbf-sync-linux-amd64 dbf-sync-linux-arm64 dbf-sync-windows-amd64.exe > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DBF-SYNC ${{ steps.version.outputs.VERSION }}
          files: |
            dbf-sync-linux-amd64
            dbf-sync-linux-arm64
            dbf-sync-windows-amd64.exe
            checksums.txt
