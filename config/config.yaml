  sanvalentin:
    host: 192.168.1.102
    port: 3307
    user: vlongo
    password: "nokia5800"
    database: sanvalentin

settings:
  dbf_directories:
    wercho: /home/vlongo/VB/BASES/WERCHOW/
    sanvalentin: /home/vlongo/VB/BASES/MUTUAL/

tables:
  # ═══════════════════════════════════════════════════
  # PAGOS - Upsert por SERIE+NRO_RECIBO+DIA_EMI
  # Cobradores: SERIE=2(wercho)/22(sanvalentin), MOVIM=N/P/A
  # ═══════════════════════════════════════════════════
  pagos:
    mode: upsert
    match_keys: [SERIE, NRO_RECIBO, DIA_EMI]
    cobrador:
      serie: [2, 22]
      movim_pending: "N"
      movim_settled: "P"
      movim_cancelled: "A"
      dia_emi_field: DIA_EMI

  # ═══════════════════════════════════════════════════
  # PAGO_BCO - Solo append (nuevos registros)
  # ═══════════════════════════════════════════════════
  pago_bco:
    mode: append
    match_keys: [id]

  # ═══════════════════════════════════════════════════
  # MAESTRO - Insertar nuevos, forzar ESTADO=1
  # ═══════════════════════════════════════════════════
  maestro:
    mode: append
    match_keys: [CONTRATO]
    post_insert:
      - set: {ESTADO: 1}
        description: "Forzar ESTADO=1 para nuevos registros"

  # ═══════════════════════════════════════════════════
  # ADHERENT - Upsert con lógica de ESTADO según BAJA
  # BAJA IS NULL → ESTADO=1 (activo)
  # BAJA IS NOT NULL → ESTADO=0 (baja/fallecimiento)
  # ═══════════════════════════════════════════════════
  adherent:
    mode: upsert
    match_keys: [CONTRATO, NRO_DOC]
    post_insert:
      - set: {ESTADO: 1}
        when: "BAJA IS NULL"
      - set: {ESTADO: 0}
        when: "BAJA IS NOT NULL"
    post_update:
      - set: {ESTADO: 1}
        when: "BAJA IS NULL"
      - set: {ESTADO: 0}
        when: "BAJA IS NOT NULL"

  # ═══════════════════════════════════════════════════
  # CUO_FIJA - Solo append (nuevos registros)
  # Solo tiene 7 campos en el .dbf
  # ═══════════════════════════════════════════════════
  cuo_fija:
    mode: append
    match_keys: [CONTRATO]

  # ═══════════════════════════════════════════════════
  # BAJAS (BAJ_ADH.DBF) - Solo append (bajas de adherentes)
  # ═══════════════════════════════════════════════════
  bajas:
    mode: append
    match_keys: [CONTRATO]
